backend:
  name: github
  repo: zaidrax01-del/Nbd-site-
  branch: main

media_folder: "public/photos"
public_folder: "/photos"

site_url: https://nbdaa.netlify.app
display_url: https://nbdaa.netlify.app
logo_url: https://nbdaa.netlify.app/favicon.svg

collections:
  # ---------- SITE SETTINGS ----------
  - name: settings
    label: "Site Settings"
    files:
      - name: site
        label: "Business Info"
        file: "src/data/settings.json"
        fields:
          - { label: "Business Name", name: "businessName", widget: "string", default: "NBD" }
          - { label: "Full Name", name: "fullName", widget: "string", default: "Nothing But Detailing" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone (link format)", name: "phone", widget: "string", hint: "e.g. +18188532288 — no spaces" }
          - { label: "Phone (display)", name: "phoneDisplay", widget: "string", hint: "e.g. (818) 853-2288" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Booking URL", name: "bookingUrl", widget: "string", required: false }
          - { label: "Hero Description", name: "heroDescription", widget: "text" }
          - { label: "Short Footer Description", name: "shortDescription", widget: "text" }
          - { label: "About Paragraphs", name: "aboutParagraphs", widget: "list" }
          - label: "Hours"
            name: "hours"
            widget: "list"
            summary: "{{fields.label}} — {{fields.value}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "Closed", name: "closed", widget: "boolean", default: false, required: false }
          - { label: "Service Areas", name: "areas", widget: "list" }
          - label: "Social Links"
            name: "socials"
            widget: "object"
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "TikTok URL", name: "tiktok", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Google Business URL", name: "google", widget: "string", required: false }

  # ---------- SERVICES ----------
  - name: services
    label: "Services"
    label_singular: "Service"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["weight", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Starting Price", name: "price", widget: "string", hint: "e.g. $100 or $100+" }
      - { label: "Icon (emoji)", name: "icon", widget: "string", default: "✨" }
      - { label: "Category", name: "category", widget: "select", options: ["main", "addon"], default: "main" }
      - { label: "Display Order", name: "weight", widget: "number", default: 100, hint: "Lower numbers show first" }
      - { label: "Featured (show as card)", name: "featured", widget: "boolean", default: false }
      - { label: "Body (optional)", name: "body", widget: "markdown", required: false }

  # ---------- BEFORE & AFTER ----------
  - name: beforeafter
    label: "Before & After"
    label_singular: "Pair"
    folder: "src/content/beforeafter"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["weight", "caption"]
    fields:
      - { label: "Before Image", name: "beforeImage", widget: "image" }
      - { label: "After Image", name: "afterImage", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", hint: "e.g. Driver's seat, 2019 Tacoma" }
      - { label: "Vehicle", name: "vehicle", widget: "string", required: false }
      - { label: "Display Order", name: "weight", widget: "number", default: 100 }
      - { label: "Feature on homepage", name: "featured", widget: "boolean", default: false }

  # ---------- GALLERY ----------
  - name: gallery
    label: "Gallery"
    label_singular: "Photo"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["weight", "caption"]
    fields:
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["interior", "exterior", "wheels", "engine", "other"], default: "other" }
      - { label: "Display Order", name: "weight", widget: "number", default: 100 }
      - { label: "Feature on homepage", name: "featured", widget: "boolean", default: false }

  # ---------- REVIEWS ----------
  - name: reviews
    label: "Reviews"
    label_singular: "Review"
    folder: "src/content/reviews"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["weight", "name"]
    fields:
      - { label: "Customer Name", name: "name", widget: "string" }
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Burbank, CA" }
      - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
      - { label: "Display Order", name: "weight", widget: "number", default: 100 }
      - { label: "Quote", name: "body", widget: "markdown" }

  # ---------- FAQ ----------
  - name: faq
    label: "FAQ"
    label_singular: "Question"
    folder: "src/content/faq"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["weight", "question"]
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Display Order", name: "weight", widget: "number", default: 100 }
      - { label: "Answer", name: "body", widget: "markdown" }
